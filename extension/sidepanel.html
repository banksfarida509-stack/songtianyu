<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 招聘副驾</title>
<style>
  :root{--fg:#1F2329;--mut:#6B717B;--line:#E1E5EC;--bg:#fff;--soft:#F6F7F9;--ok:#0E8A5F;--warn:#E08A00;--no:#8A9099;--err:#C4313B;--pri:#2F6BFF}
  @media (prefers-color-scheme: dark){:root{--fg:#E6E8EB;--mut:#9AA0A8;--line:#33373D;--bg:#1B1D21;--soft:#24272C}}
  *{box-sizing:border-box}
  body{margin:0;padding:12px;background:var(--bg);color:var(--fg);font:13px/1.55 "PingFang SC","Microsoft YaHei",sans-serif}
  h1{font-size:15px;margin:0 0 2px} .mut{color:var(--mut);font-size:12px}
  .head{display:flex;align-items:baseline;gap:8px;justify-content:space-between;margin-bottom:10px}
  .err{background:#FDECEC;color:var(--err);border-radius:6px;padding:8px 10px;margin:8px 0}
  .box{border:1px solid var(--line);border-radius:8px;padding:10px;margin:10px 0}
  .sub{font-weight:600;margin:12px 0 6px}
  .tag{display:inline-block;padding:2px 12px;line-height:24px;border-radius:6px;font-size:16px;font-weight:700;color:#fff;letter-spacing:.5px}
  .tag.ok{background:var(--ok)} .tag.warn{background:var(--warn)} .tag.no{background:var(--no)}
  .score{font:700 24px/28px "DIN Alternate","Bahnschrift",sans-serif;color:#D0161F;margin-left:6px} .score small{font-size:13px;margin-left:2px}
  .verdict{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .why{margin-top:6px;color:var(--fg)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin:8px 0}
  .stats div{background:var(--soft);border-radius:6px;padding:6px 0;font-size:12px;color:var(--mut)} .stats b{display:block;font-size:18px;color:var(--fg)}
  .item{border-top:1px solid var(--line);padding:8px 0} .item:first-child{border-top:0}
  .item .nm{font-weight:600;margin-right:6px}
  .item .tag{font-size:13px;line-height:20px;padding:0 8px} .item .score{font-size:18px}
  .draft{white-space:pre-wrap;background:var(--soft);border-radius:6px;padding:10px;margin:8px 0}
  .draft.bad{outline:2px solid var(--err)}
  .draft hr{border:0;border-top:1px dashed var(--line);margin:8px 0}
  .ck{font-size:12px} .ck.ok{color:var(--ok)} .ck.bad{color:var(--err)}
  .act{background:#FDF2E3;color:#8A4B00;border-radius:6px;padding:6px 8px;margin:6px 0;font-size:12px}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  button{font:inherit;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:6px;padding:5px 12px;cursor:pointer}
  button.pri{background:var(--pri);border-color:var(--pri);color:#fff}
  select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:2px 4px;background:var(--bg);color:var(--fg)}
  details{margin-top:12px} summary{cursor:pointer;color:var(--mut)} .log div{font-size:11.5px;color:var(--mut)}
</style>
</head>
<body>
<div id="app"></div>
<script src="sidepanel.js"></script>
</body>
</html>
